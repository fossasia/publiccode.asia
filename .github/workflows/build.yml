name: Cross-Platform Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact_name: VoxBento-Local-macOS-AppleSilicon
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: VoxBento-Local-Linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: VoxBento-Local-Windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute build version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            echo "version=${TAG_VER}" >> $GITHUB_OUTPUT
            echo "tag=v${TAG_VER}" >> $GITHUB_OUTPUT
          else
            BUILD_VER="0.1.${{ github.run_number }}"
            echo "version=${BUILD_VER}" >> $GITHUB_OUTPUT
            echo "tag=v${BUILD_VER}" >> $GITHUB_OUTPUT

            node -e "
              const fs = require('fs');
              const pkgPath = 'frontend/package.json';
              const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
              pkg.version = '${BUILD_VER}';
              fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2));

              const tauriPath = 'frontend/src-tauri/tauri.conf.json';
              const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
              tauri.version = '${BUILD_VER}';
              fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 4));
            "
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev ffmpeg

      - name: Build llama-helper sidecar binary
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/binaries
          if [ "${{ runner.os }}" = "macOS" ]; then
            cargo build -p llama-helper --release --features metal
            cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
            chmod +x frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cargo build -p llama-helper --release
            cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu
            chmod +x frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cargo build -p llama-helper --release
            cp target/release/llama-helper.exe frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: 'VoxBento Local ${{ steps.version.outputs.tag }}'
          releaseBody: 'VoxBento Local (Voxa) on-device AI meeting and interpretation console.'
          releaseDraft: false
          prerelease: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
