name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Lint, Typecheck & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend Typecheck
        working-directory: frontend
        run: pnpm run typecheck

      - name: Frontend Build
        working-directory: frontend
        run: pnpm run build

  rust:
    name: Rust Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev ffmpeg

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust Check
        run: cargo check --manifest-path frontend/src-tauri/Cargo.toml

      - name: Configure ONNX Runtime path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $onnxDir = "$((Get-Item .).FullName)\frontend\src-tauri\binaries\onnxruntime"
          if (Test-Path $onnxDir) {
            Write-Host "Adding $onnxDir to GITHUB_PATH"
            $onnxDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Rust Unit Tests
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml -- --nocapture
